<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Inspecao de Lotes</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f6f8;
      color: #1f2933;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
      border-bottom: 1px solid #d7dde5;
      padding-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }
    .subtitle {
      margin: 6px 0 0;
      color: #5d6b7a;
      font-size: 14px;
    }
    .badge {
      border: 1px solid #bfd1e5;
      background: #eaf3ff;
      color: #164b7a;
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 13px;
      white-space: nowrap;
    }
    form {
      background: #ffffff;
      border: 1px solid #d7dde5;
      border-radius: 6px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(31, 41, 51, 0.06);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .wide { grid-column: span 2; }
    .full { grid-column: 1 / -1; }
    label {
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }
    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #b8c2cc;
      border-radius: 4px;
      padding: 10px 11px;
      color: #1f2933;
      font-size: 14px;
      outline: none;
      background: #ffffff;
    }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: #1d6fb8;
      box-shadow: 0 0 0 3px rgba(29, 111, 184, 0.14);
    }
    textarea {
      min-height: 92px;
      resize: vertical;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
      border-top: 1px solid #edf0f3;
      padding-top: 16px;
    }
    button {
      border: 0;
      border-radius: 4px;
      background: #1d6fb8;
      color: #ffffff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      padding: 11px 16px;
    }
    button:hover { background: #155b98; }
    #resultado {
      display: none;
      margin-top: 18px;
      border: 1px solid #9bd2ad;
      border-radius: 6px;
      background: #eefaf1;
      color: #176333;
      padding: 14px 16px;
      font-size: 14px;
    }
    #resultado strong {
      display: block;
      margin-bottom: 4px;
    }
    @media (max-width: 820px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }
      .grid { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Simulador de Inspecao de Lotes</h1>
        <p class="subtitle">Tela local para validar Playwright e Selenium com dados da planilha diaria.</p>
      </div>
      <div class="badge">Ambiente simulado</div>
    </header>

    <form id="form-inspecao">
      <div class="grid">
        <div class="field">
          <label for="lote_id">lote_id</label>
          <input id="lote_id" name="lote_id" type="text" required>
        </div>
        <div class="field wide">
          <label for="produto">produto</label>
          <input id="produto" name="produto" type="text" required>
        </div>
        <div class="field">
          <label for="linha">linha</label>
          <input id="linha" name="linha" type="text" required>
        </div>
        <div class="field">
          <label for="turno">turno</label>
          <input id="turno" name="turno" type="text" required>
        </div>
        <div class="field">
          <label for="status">status</label>
          <select id="status" name="status" required>
            <option value="">Selecione</option>
            <option value="APROVADO">APROVADO</option>
            <option value="REPROVADO">REPROVADO</option>
            <option value="PENDENTE">PENDENTE</option>
          </select>
        </div>
        <div class="field">
          <label for="responsavel">responsavel</label>
          <input id="responsavel" name="responsavel" type="text" required>
        </div>
        <div class="field">
          <label for="data">data</label>
          <input id="data" name="data" type="text" required>
        </div>
        <div class="field full">
          <label for="observacao">observacao</label>
          <textarea id="observacao" name="observacao"></textarea>
        </div>
      </div>

      <div class="actions">
        <button id="btn-processar" type="submit">Registrar inspecao</button>
      </div>
    </form>

    <section id="resultado" aria-live="polite">
      <strong>Inspecao registrada</strong>
      <span id="mensagem-resultado"></span>
    </section>
  </main>

  <script>
    const form = document.getElementById("form-inspecao");
    const resultado = document.getElementById("resultado");
    const mensagem = document.getElementById("mensagem-resultado");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const loteId = document.getElementById("lote_id").value;
      const produto = document.getElementById("produto").value;
      const status = document.getElementById("status").value;
      const linha = document.getElementById("linha").value;

      mensagem.textContent = `Lote ${loteId} (${produto}) registrado na linha ${linha} com status ${status}.`;
      resultado.style.display = "block";
    });
  </script>
</body>
</html>
