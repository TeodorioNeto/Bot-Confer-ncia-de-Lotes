name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Testes principais
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Executar testes
        run: python -m pytest -q tests --ignore=tests/e2e

  test-e2e:
    name: Testes E2E
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Instalar browser Playwright
        run: python -m playwright install --with-deps chromium

      - name: Executar testes E2E
        run: python -m pytest tests/e2e -v --tb=short --browser chromium

  build-docker:
    name: Build e teste em container
    runs-on: ubuntu-latest
    needs: [test, test-e2e]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencia para massa sintetica
        run: python -m pip install openpyxl

      - name: Gerar planilha sintetica de inspecao
        run: python tests/fixtures/gerar_planilha_ci.py

      - name: Preparar pastas de saida
        run: mkdir -p logs data/output reports screenshots

      - name: Build da imagem Docker
        run: docker compose build

      - name: Smoke test no Docker
        run: docker compose run --rm bot-conferencia

      - name: Verificar evidencias geradas
        run: |
          test -f logs/execucao.log
          test -f logs/resumo_execucao.json
          test -f logs/inspecao_lotes_dia_analisado.xlsx
          test -n "$(find data/output -type f -name '*.xlsx' -print -quit)"
          test -n "$(find screenshots -type f -name '*.png' -print -quit)"

      - name: Publicar artefatos de evidencia
        uses: actions/upload-artifact@v4
        with:
          name: docker-evidencias
          path: |
            logs/
            data/output/
            screenshots/
